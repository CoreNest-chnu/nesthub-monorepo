services:
  db:
    image: postgres:17-alpine
    container_name: nest-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nest-hub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nest-hub-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - nest-hub-network

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      target: dev
    container_name: nest-hub
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASS}@db:5432/${DB_NAME}?schema=public
      PORT: ${API_PORT:-8000}
      NODE_ENV: development
      # Auth secrets — real .env is git/docker-ignored, so pass them here.
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-86400}
      STATIC_SALT: ${STATIC_SALT:-dev-static-salt-change-me}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
    networks:
      - nest-hub-network

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      target: dev
    container_name: nest-hub-web
    restart: unless-stopped
    environment:
      NODE_ENV: development
      # Browser-side calls (run on the host) use localhost.
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
      # Server-side proxy (runs inside the container) must reach the API via the
      # compose service name, not localhost.
      API_PROXY_TARGET: http://api:8000
      # NextAuth requires a secret to be defined.
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web/src:/app/apps/web/src
    networks:
      - nest-hub-network

networks:
  nest-hub-network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
