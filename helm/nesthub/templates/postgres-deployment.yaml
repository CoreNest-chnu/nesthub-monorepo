apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nesthub.componentName" (list . "postgres") }}
  labels:
    {{- include "nesthub.componentLabels" (list . "postgres") | nindent 4 }}
spec:
  # One replica: a ReadWriteOnce volume mounts into a single pod. Recreate stops
  # the old pod before the new one starts, so they never share the volume.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "nesthub.selectorLabels" (list . "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nesthub.componentLabels" (list . "postgres") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ include "nesthub.image" (list . .Values.postgres.image) }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: {{ include "nesthub.configName" . }}, key: POSTGRES_DB }
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: { name: {{ include "nesthub.configName" . }}, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "nesthub.secretName" . }}, key: POSTGRES_PASSWORD }
            # Subdirectory: the volume root contains lost+found and initdb refuses it.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          {{- if .Values.postgres.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "nesthub.componentName" (list . "postgres-data") }}
          {{- else }}
          emptyDir: {}
          {{- end }}
