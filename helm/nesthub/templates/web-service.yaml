apiVersion: v1
kind: Service
metadata:
  name: {{ include "nesthub.componentName" (list . "web") }}
  labels:
    {{- include "nesthub.componentLabels" (list . "web") | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "nesthub.selectorLabels" (list . "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      {{- if and (eq .Values.web.service.type "NodePort") .Values.web.service.nodePort }}
      nodePort: {{ .Values.web.service.nodePort }}
      {{- end }}
