{{- /* No secret values live in this template: they come from .Values.secrets,
       or are generated once and then read back from the cluster on upgrades. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "nesthub.secretName" .) }}
{{- $data := dict }}
{{- if $existing }}{{- $data = $existing.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nesthub.secretName" . }}
  labels:
    {{- include "nesthub.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ include "nesthub.secretValue" (list $data "POSTGRES_PASSWORD" .Values.secrets.postgresPassword) | quote }}
  JWT_SECRET: {{ include "nesthub.secretValue" (list $data "JWT_SECRET" .Values.secrets.jwtSecret) | quote }}
  STATIC_SALT: {{ include "nesthub.secretValue" (list $data "STATIC_SALT" .Values.secrets.staticSalt) | quote }}
  AUTH_SECRET: {{ include "nesthub.secretValue" (list $data "AUTH_SECRET" .Values.secrets.authSecret) | quote }}
