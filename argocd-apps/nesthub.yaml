# NestHub, deployed from the Helm chart in charts/nesthub with values-minikube.yaml.
# The Application name is the Helm release name, so objects are called
# nesthub-api, nesthub-web, ... exactly as after `helm install nesthub` in lab 4.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nesthub
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/CoreNest-chnu/nesthub-monorepo.git
    targetRevision: lab/dev-ops-7
    path: charts/nesthub
    helm:
      # Relative to `path`, not to the repository root.
      valueFiles:
        - values-minikube.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: nesthub
  syncPolicy:
    automated:
      # Objects removed from Git are removed from the cluster.
      prune: true
      # A manual change in the cluster is reverted to the state in Git.
      selfHeal: true
    # The chart uses the Rollout CRD from argo-rollouts.yaml. If this app syncs
    # before the CRD exists ("no matches for kind Rollout"), retry instead of
    # staying SyncFailed.
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
