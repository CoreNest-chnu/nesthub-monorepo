# Loki in single-binary mode: one process, logs on the local filesystem, no
# caches, canary or tests. Grafana reads it through loki-gateway (see the
# Loki data source in kps.yaml); Alloy (alloy.yaml) pushes logs to it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    # Since March 2026 the Loki chart is maintained by the community.
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    # Latest chart version from `helm search repo grafana-community/loki`.
    targetRevision: 21.6.0
    helm:
      valuesObject:
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig: { replication_factor: 1 }
          storage: { type: filesystem }
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index: { prefix: index_, period: 24h }
        singleBinary: { replicas: 1 }
        read: { replicas: 0 }
        write: { replicas: 0 }
        backend: { replicas: 0 }
        chunksCache: { enabled: false }
        resultsCache: { enabled: false }
        lokiCanary: { enabled: false }
        test: { enabled: false }
        # No `minio` key: chart 21.x dropped the bundled MinIO and its values
        # schema rejects the key.
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
