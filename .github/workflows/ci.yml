name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Для PR старі запуски скасовуються, для push (публікація образів) - ні
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Основна гілка: саме для неї публікується тег latest.
  # Якщо основна гілка у твоєму репозиторії називається develop, зміни значення.
  MAIN_BRANCH: develop
  BUN_VERSION: 1.3.7
  NODE_VERSION: 22

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint + Build + Test для кожного сервісу (паралельно, незалежно)
  # ---------------------------------------------------------------------------
  ci:
    name: "Build & Test (${{ matrix.service }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # падіння одного сервісу не скасовує інший
      matrix:
        service: [api, web]
    env:
      # Фіктивні значення, щоб тести та збірка не вимагали реальних секретів
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
      JWT_SECRET: ci-jwt-secret
      JWT_EXPIRES_IN: "86400"
      STATIC_SALT: ci-static-salt
      AUTH_SECRET: ci-auth-secret
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate
        if: matrix.service == 'api'
        working-directory: apps/api
        run: bunx prisma generate

      # Блокуючий статичний аналіз: помилки ESLint завершують job з помилкою
      - name: Lint (ESLint)
        working-directory: apps/${{ matrix.service }}
        run: |
          if [ "${{ matrix.service }}" = "api" ]; then
            bunx eslint "{src,apps,libs,test}/**/*.ts"
          else
            bunx eslint
          fi

      - name: Build
        run: bun run --filter=${{ matrix.service }} build

      - name: Test
        run: bun run --filter=${{ matrix.service }} --if-present test

  # ---------------------------------------------------------------------------
  # 2. Збірка образів і сканування вразливостей (без публікації)
  #    Запускається лише після успіху ВСІХ job з build/test
  # ---------------------------------------------------------------------------
  docker:
    name: "Docker build & scan (${{ matrix.service }})"
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.service }}/Dockerfile
          target: dev # той самий target, що й у docker-compose.yaml
          load: true
          push: false
          tags: nesthub-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Блокуючий крок: знайдені критичні вразливості завершують job з помилкою.
      # Для суворішої перевірки зміни severity на CRITICAL,HIGH.
      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
              --severity CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              nesthub-${{ matrix.service }}:ci

  # ---------------------------------------------------------------------------
  # 3. Публікація образів у GitHub Container Registry (лише push, не PR)
  # ---------------------------------------------------------------------------
  publish:
    name: "Publish (${{ matrix.service }})"
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR вимагає імена образів малими літерами
      - name: Lowercase repository owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/nesthub-${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref_name == env.MAIN_BRANCH }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.service }}/Dockerfile
          target: dev
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
