# Внутрішня адреса БД для API: db:5432 (те саме ім'я, що й у docker-compose).
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: nesthub
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: nesthub
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
