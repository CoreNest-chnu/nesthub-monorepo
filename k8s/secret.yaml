# Чутливі параметри. Значення демонстраційні, для локального кластера, —
# не паролі від реальних систем. stringData Kubernetes сам кодує в base64.
apiVersion: v1
kind: Secret
metadata:
  name: nesthub-secret
  namespace: nesthub
  labels:
    app.kubernetes.io/part-of: nesthub
type: Opaque
stringData:
  POSTGRES_PASSWORD: lab3-demo-db-password
  JWT_SECRET: lab3-demo-jwt-secret
  STATIC_SALT: lab3-demo-static-salt
  AUTH_SECRET: lab3-demo-nextauth-secret
