# Default values = development environment.
# Override per environment with -f values-dev.yaml / -f values-prod.yaml.

nameOverride: ""
fullnameOverride: ""

api:
  replicaCount: 1
  image:
    repository: ghcr.io/corenest-chnu/nesthub-api
    # Empty = Chart.appVersion.
    tag: "1.3.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: 500m, memory: 512Mi }
  # Extra environment variables of the API container, as a list of EnvVar.
  # FAIL_RATE (0..1) = share of requests answered with 500 on purpose.
  env: []
  # Progressive delivery with Argo Rollouts: true replaces the API Deployment
  # with a Rollout (requires the Argo Rollouts controller and CRDs).
  rollout:
    enabled: false
    # AnalysisTemplate <fullname>-api-success-rate: share of non-5xx requests
    # from Prometheus. Reference it from a step of the strategy below.
    analysis:
      enabled: false
      prometheusAddress: http://kps-prometheus.monitoring:9090
      # PromQL label filter of the requests to analyse.
      selector: 'namespace="nesthub"'
      successThreshold: 0.95
    # spec.strategy of the Rollout, passed through as is.
    strategy:
      canary:
        steps:
          - setWeight: 20
          - pause: {}
          - setWeight: 60
          - pause: { duration: 30s }

web:
  replicaCount: 1
  image:
    repository: ghcr.io/corenest-chnu/nesthub-web
    tag: "1.3.0"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 3000
    # Fixed node port for NodePort services; empty = picked by Kubernetes.
    nodePort: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

postgres:
  image:
    repository: postgres
    tag: 17-alpine
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  persistence:
    # false = emptyDir: data is lost when the pod is recreated.
    enabled: true
    size: 1Gi
    # Empty = the cluster's default StorageClass.
    storageClass: ""

# Observability (needs kube-prometheus-stack CRDs): ServiceMonitor for GET
# /metrics of the API, Grafana dashboard ConfigMap and an optional alert.
metrics:
  enabled: false
  path: /metrics
  interval: 15s
  alerts:
    enabled: false
    # Share of 5xx responses (0..1) that fires NesthubApiHighErrorRate.
    errorRateThreshold: 0.05
    for: 1m

ingress:
  enabled: false
  className: nginx
  host: nesthub.local

# Non-secret settings -> ConfigMap.
config:
  postgresDb: nesthub
  postgresUser: nesthub
  nodeEnv: production
  jwtExpiresIn: "86400"
  authTrustHost: "true"

# Name of a Secret that already exists in the namespace (keys POSTGRES_PASSWORD,
# JWT_SECRET, STATIC_SALT, AUTH_SECRET). When set, the chart does not render its
# own Secret and the `secrets` block below is ignored. Used by GitOps (Argo CD),
# where secret values must not live in Git.
existingSecret: ""

# Sensitive settings -> Secret. Leave empty: the chart generates a random value
# on first install and keeps the existing one on upgrades. Set them only from
# the command line (--set) or an untracked file, never commit real secrets.
secrets:
  postgresPassword: ""
  jwtSecret: ""
  staticSalt: ""
  authSecret: ""

# pre-upgrade hook: waits until the database accepts connections before the
# new API pods start migrating it.
hooks:
  preUpgradeDbCheck:
    enabled: true

tests:
  # Pod run by `helm test`. Argo CD does not run Helm test hooks.
  enabled: true
  image: curlimages/curl:8.16.0
