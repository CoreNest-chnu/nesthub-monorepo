# Development: one replica each, small resources, NodePort access, no Ingress.
api:
  replicaCount: 1
  image:
    tag: "1.3.0"
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: 500m, memory: 512Mi }

web:
  replicaCount: 1
  image:
    tag: "1.3.0"
  service:
    type: NodePort
    nodePort: 30081
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 384Mi }

postgres:
  persistence:
    size: 1Gi

ingress:
  enabled: false
