{{- $config := include "nesthub.configName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nesthub.componentName" (list . "web") }}
  labels:
    {{- include "nesthub.componentLabels" (list . "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "nesthub.selectorLabels" (list . "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nesthub.componentLabels" (list . "web") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: web
          image: {{ include "nesthub.image" (list . .Values.web.image) }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            {{- range $key := list "AUTH_TRUST_HOST" "API_PROXY_TARGET" }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef: { name: {{ $config }}, key: {{ $key }} }
            {{- end }}
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef: { name: {{ include "nesthub.secretName" . }}, key: AUTH_SECRET }
          lifecycle:
            preStop:
              exec:
                command: [sleep, "10"]
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          # /api/auth/session is served by Next itself (NextAuth), not the API.
          startupProbe:
            httpGet: { path: /api/auth/session, port: http }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /api/auth/session, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /api/auth/session, port: http }
            periodSeconds: 5
            failureThreshold: 2
