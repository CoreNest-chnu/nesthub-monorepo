# `helm test <release>` runs this Pod. It goes through the whole chain:
# web Service -> Next.js proxy -> API Service -> API -> PostgreSQL.
{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "nesthub.componentName" (list . "test-connection") }}
  labels:
    {{- include "nesthub.componentLabels" (list . "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: {{ .Values.tests.image }}
      command:
        - sh
        - -c
        - |
          set -e
          web=http://{{ include "nesthub.componentName" (list . "web") }}:{{ .Values.web.service.port }}
          echo "GET $web/api/health"
          curl -fsS "$web/api/health" | tee /dev/stderr | grep -q '"status":"ok"'
          echo
          echo "GET $web/api/health/ready (API -> PostgreSQL)"
          curl -fsS "$web/api/health/ready" | tee /dev/stderr | grep -q '"status":"ready"'
          echo
          echo "GET $web/catalog"
          curl -fsS -o /dev/null "$web/catalog"
          echo "all checks passed"
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 100m, memory: 64Mi }
{{- end }}
