{{- $config := include "nesthub.configName" . }}
{{- $secret := include "nesthub.secretName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nesthub.componentName" (list . "api") }}
  labels:
    {{- include "nesthub.componentLabels" (list . "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  revisionHistoryLimit: 5
  # New pod first, old one only after the new one is ready: no downtime.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "nesthub.selectorLabels" (list . "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nesthub.componentLabels" (list . "api") | nindent 8 }}
      annotations:
        # Config or secret changes roll the pods, so they pick up new values.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # The API runs `prisma migrate deploy` on start and fails if the DB is not up yet.
      initContainers:
        - name: wait-for-db
          image: {{ include "nesthub.image" (list . .Values.postgres.image) }}
          command: [sh, -c, 'until pg_isready -h {{ include "nesthub.dbHost" . }} -p 5432; do echo "waiting for db"; sleep 2; done']
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
      containers:
        - name: api
          image: {{ include "nesthub.image" (list . .Values.api.image) }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
          env:
            {{- range $key := list "NODE_ENV" "PORT" "JWT_EXPIRES_IN" "POSTGRES_DB" "POSTGRES_USER" }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef: { name: {{ $config }}, key: {{ $key }} }
            {{- end }}
            {{- range $key := list "POSTGRES_PASSWORD" "JWT_SECRET" "STATIC_SALT" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: {{ $key }} }
            {{- end }}
            # $(VAR) expands the variables above: the password lives only in the Secret.
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ include "nesthub.dbHost" . }}:5432/$(POSTGRES_DB)?schema=public
          # Keep serving for 10 s after removal from the Service endpoints.
          lifecycle:
            preStop:
              exec:
                command: [sleep, "10"]
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          # Generous budget: amd64 images under emulation on arm64 start slowly.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 150
          # Process is alive (no DB check, so a DB outage does not restart every pod).
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          # Ready for traffic only when the DB answers.
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            failureThreshold: 2
