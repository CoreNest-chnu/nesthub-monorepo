{{- /* Replaced by api-rollout.yaml when api.rollout.enabled is true. */}}
{{- if not .Values.api.rollout.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nesthub.componentName" (list . "api") }}
  labels:
    {{- include "nesthub.componentLabels" (list . "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  revisionHistoryLimit: 5
  # New pod first, old one only after the new one is ready: no downtime.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "nesthub.selectorLabels" (list . "api") | nindent 6 }}
  template:
    {{- include "nesthub.api.podTemplate" . | nindent 4 }}
{{- end }}
